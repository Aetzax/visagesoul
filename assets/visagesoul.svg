<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Tokyo Night Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#13141f"/>
    </radialGradient>
    
    <!-- Clean Cyan-Sapphire Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="60%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <!-- Soft Core Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#bgGrad)" stroke="#2f354a" stroke-width="4"/>

  <!-- 4 Minimalist Corner Brackets -->
  <!-- Top-Left -->
  <path d="M 96 156 L 96 124 A 28 28 0 0 1 124 96 L 156 96" fill="none" stroke="url(#neonGlow)" stroke-width="14" stroke-linecap="round"/>
  <!-- Top-Right -->
  <path d="M 356 96 L 388 96 A 28 28 0 0 1 416 124 L 416 156" fill="none" stroke="url(#neonGlow)" stroke-width="14" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 96 356 L 96 388 A 28 28 0 0 0 124 416 L 156 416" fill="none" stroke="url(#neonGlow)" stroke-width="14" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 356 416 L 388 416 A 28 28 0 0 0 416 388 L 416 356" fill="none" stroke="url(#neonGlow)" stroke-width="14" stroke-linecap="round"/>

  <!-- Minimalist Biometric Lens -->
  <!-- Outer Glow Field -->
  <circle cx="256" cy="256" r="100" fill="url(#coreGlow)"/>

  <!-- Main Ring -->
  <circle cx="256" cy="256" r="76" fill="none" stroke="url(#neonGlow)" stroke-width="10"/>

  <!-- Center Solid Optical Core -->
  <circle cx="256" cy="256" r="28" fill="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>
