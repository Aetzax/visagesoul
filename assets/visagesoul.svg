<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e202e"/>
      <stop offset="100%" stop-color="#13141c"/>
    </radialGradient>
    
    <!-- Neon Cyan to Purple Glow -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <!-- Iris Glow Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dcfff"/>
      <stop offset="70%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </radialGradient>

    <!-- Target Frame Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="url(#bgGrad)" stroke="#2f354a" stroke-width="4"/>

  <!-- Biometric HUD Targeting Corner Brackets -->
  <!-- Top-Left -->
  <path d="M 90 170 L 90 110 A 20 20 0 0 1 110 90 L 170 90" fill="none" stroke="url(#neonGlow)" stroke-width="12" stroke-linecap="round"/>
  <!-- Top-Right -->
  <path d="M 342 90 L 402 90 A 20 20 0 0 1 422 110 L 422 170" fill="none" stroke="url(#neonGlow)" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 90 342 L 90 402 A 20 20 0 0 0 110 422 L 170 422" fill="none" stroke="url(#neonGlow)" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 342 422 L 402 422 A 20 20 0 0 0 422 402 L 422 342" fill="none" stroke="url(#neonGlow)" stroke-width="12" stroke-linecap="round"/>

  <!-- Subtle Target Crosshairs / Scan Dots -->
  <circle cx="256" cy="74" r="5" fill="#7dcfff" opacity="0.8"/>
  <circle cx="256" cy="438" r="5" fill="#7dcfff" opacity="0.8"/>
  <circle cx="74" cy="256" r="5" fill="#7dcfff" opacity="0.8"/>
  <circle cx="438" cy="256" r="5" fill="#7dcfff" opacity="0.8"/>

  <!-- Futuristic Biometric Eye Outer Shape -->
  <path d="M 96 256 C 146 160, 366 160, 416 256 C 366 352, 146 352, 96 256 Z" 
        fill="none" stroke="url(#neonGlow)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Scanning Ring Arc Around Iris -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="#2ac3de" stroke-width="4" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#bb9af7" stroke-width="3" stroke-dasharray="40 20 10 20" opacity="0.7"/>

  <!-- Iris Center -->
  <circle cx="256" cy="256" r="64" fill="url(#irisGrad)" filter="url(#glow)"/>

  <!-- Deep Pupil -->
  <circle cx="256" cy="256" r="30" fill="#0f1017"/>

  <!-- Cybernetic Core / Catchlight Sparkle -->
  <circle cx="242" cy="242" r="10" fill="#ffffff"/>
  <circle cx="270" cy="268" r="4" fill="#ffffff" opacity="0.8"/>
  
  <!-- Subtle Horizontal Scan Beam -->
  <line x1="130" y1="256" x2="382" y2="256" stroke="#ffffff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
</svg>
