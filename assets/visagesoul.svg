<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Tokyo Night Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#13141f"/>
    </radialGradient>
    
    <!-- Smooth Cyber Sapphire to Violet Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <!-- Core Lens Radial Glow -->
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7aa2f7" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#3d59a1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16161e" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" stroke="#2f354a" stroke-width="4"/>

  <!-- 4 Corner HUD Framing Brackets [  ] -->
  <!-- Top-Left -->
  <path d="M 88 150 L 88 116 A 28 28 0 0 1 116 88 L 150 88" fill="none" stroke="url(#neonGlow)" stroke-width="10" stroke-linecap="round"/>
  <!-- Top-Right -->
  <path d="M 362 88 L 396 88 A 28 28 0 0 1 424 116 L 424 150" fill="none" stroke="url(#neonGlow)" stroke-width="10" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 88 362 L 88 396 A 28 28 0 0 0 116 424 L 150 424" fill="none" stroke="url(#neonGlow)" stroke-width="10" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 362 424 L 396 424 A 28 28 0 0 0 424 396 L 424 362" fill="none" stroke="url(#neonGlow)" stroke-width="10" stroke-linecap="round"/>

  <!-- Subtle Focus Dots -->
  <circle cx="256" cy="72" r="4.5" fill="#7dcfff" opacity="0.7"/>
  <circle cx="256" cy="440" r="4.5" fill="#7dcfff" opacity="0.7"/>
  <circle cx="72" cy="256" r="4.5" fill="#7dcfff" opacity="0.7"/>
  <circle cx="440" cy="256" r="4.5" fill="#7dcfff" opacity="0.7"/>

  <!-- Abstract Optical Sensor / Stylized Visor Arcs -->
  <path d="M 104 256 C 152 176, 360 176, 408 256" fill="none" stroke="url(#neonGlow)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M 104 256 C 152 336, 360 336, 408 256" fill="none" stroke="url(#neonGlow)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Concentric Cybernetic HUD Rings (Replaces Realistic Iris/Pupil) -->
  <circle cx="256" cy="256" r="88" fill="url(#lensGrad)"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#7aa2f7" stroke-width="3.5" stroke-dasharray="24 16" opacity="0.75"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="#bb9af7" stroke-width="3" stroke-dasharray="40 20 10 20" opacity="0.85"/>
  
  <!-- Optical Aperture Blades / Core Node -->
  <circle cx="256" cy="256" r="32" fill="#1f2335" stroke="#7dcfff" stroke-width="4"/>
  <circle cx="256" cy="256" r="16" fill="#7dcfff" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Subtle Horizontal Precision Scan Tick Marks -->
  <line x1="140" y1="256" x2="168" y2="256" stroke="#7dcfff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="344" y1="256" x2="372" y2="256" stroke="#7dcfff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
</svg>
