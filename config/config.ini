[general]
# Interface language: "es" (Español), "en" (English), or "auto"
language = auto

[camera]
# Video device path or index
device = /dev/video0
# Resolution
width = 1280
height = 720
# Codec (MJPG or YUYV)
fourcc = MJPG
# Target capture frame rate
fps = 30
# Sensor warmup frames (essential for Logitech StreamCam auto-exposure)
warmup_frames = 5
# Automatic brightness compensation for dark environments
low_light_boost = true

[security]
# Cosine similarity threshold for face match (0.60 - 0.85). 0.70 is standard.
threshold = 0.70
# Verification timeout in seconds
timeout = 4.0
# Minimum face width/height in pixels
min_face_size = 60
# Liveness check (micro-movement & angle analysis)
liveness_check = true
# Require thumbs-up gesture (👍) to confirm authentication
require_thumbs_up = false
# Auto unlock without waiting for extra button clicks
auto_unlock = true
# Play pleasant audio chime upon successful biometric match
sound_feedback = true
# Sound feedback volume percentage (1-100, default: 35 for subtle sound)
sound_volume = 35
# Max failed attempts before forcing password (1-10)
max_attempts = 3
# Time window in seconds for counting failed attempts
attempts_window = 300

[paths]
# Directory where AI models are stored
models_dir = /usr/share/visagesoul/models
# Directory where user face embeddings are securely stored
faces_dir = /etc/visagesoul/faces
# Log file
log_file = /var/log/visagesoul.log

[pam]
# Enable debug messages to syslog / stderr
debug = false
# Send info messages to PAM conversation
notify = true
# Custom message displayed on lock screen / login screen
message = Esperando biometría...
